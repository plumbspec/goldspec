name: verify

# The suite and the spec gate, on a machine that did not grow a developer's environment. It installs
# what `pyproject` declares and runs both — nothing here signs, stamps or publishes anything.
#
# **Asked for, never automatic**, as plumb's is: it is a step in a cut, so it runs when somebody is
# cutting. A build that fires on every push trains the habit of scrolling past a red mark, and the
# one run that matters stops being read. Between cuts, a green result is still one machine's word.
#
# **Every action is pinned to a commit, not a tag.** A tag is mutable — whoever owns the action can
# repoint it — and the artifact this build vouches for is signed. The trailing comment names the
# version the commit was, and dependabot updates both together.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Roughly ten times the observed run: room for a cold runner, none for a hang.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Not the floor — `pyproject` declares 3.9, and `tests/test_floor.py` says what holds it.
          python-version: "3.11"

      - name: install what the suite needs
        # From the extra pyproject declares, never a version typed here.
        run: python3 -m pip install --disable-pip-version-check -e ".[dev]"

      - name: run the suite
        run: python3 -m pytest -q

      - name: gate goldspec's own spec
        run: goldspec spec
