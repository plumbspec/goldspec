[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "goldspec.BASE_VERSION"}

[project]
name = "goldspec"
# Read from `goldspec.BASE_VERSION`, never typed here. It was typed here, and the constant beside
# it called itself "the one authored version" while being the second — so a bump to this file left
# the command still reporting the old number, which is how two of them stay apart without anybody
# seeing it. plumb's own pyproject records the same fault and the same fix.
dynamic = ["version"]
description = "The gold-spec methodology and its gates — optional, and unknown to plumb."
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
# pytest, because a gate is a test: the method is delivered as checks a project runs in its own
# suite, which is what lets plumb observe them without learning that they are method gates.
#
# Floored at 8 rather than 9 because 9 does not reach Python 3.9, and a floor the dependency
# cannot be installed at is not a floor. Nothing here imports pytest — what the pin buys is a
# runner present for the gate an adopter runs, and 8 runs it.
dependencies = ["pytest>=8"]

# The command, and now only the command. A wheel was once the only shape that worked, because a
# project's chapter modules did `from goldspec import story` and nothing can import that out of a
# single-file archive. Subjects are declared in markdown now, so nothing outside this package
# imports it and the second half of that argument is gone — a zipapp is viable, and choosing one
# is a packaging decision rather than a constraint.
[project.scripts]
goldspec = "goldspec.cli:main"

[project.optional-dependencies]
# setuptools because the cut builds the wheel with `--no-build-isolation`: a release that
# has to reach the network to build is one that cannot be cut from a machine that has no route out,
# and the offline property is asserted elsewhere rather than assumed.
dev = ["pytest>=8", "setuptools>=68"]

[tool.setuptools.packages.find]
where = ["src"]

# The vendored parser's licence travels with the code it licenses. `packages.find` collects
# modules and nothing else, so an MIT notice beside them is left out of the wheel while the
# code it covers ships — the one file whose absence is a licence fault rather than a missing
# convenience. The zipapp carries the whole directory and was never short of it, which is how
# this stayed invisible.
[tool.setuptools.package-data]
"goldspec._vendor.tomli" = ["LICENSE", "README.md"]

[tool.pytest.ini_options]
testpaths = ["spec", "tests"]
# A citation is a mark, and a mark is not an import — registering the name plumb reads keeps the
# one-way dependency `test_boundary.py` asserts, while letting this suite cite the subjects it
# proves. Without it pytest calls every citation a possible typo, which is noise that teaches
# people to stop reading warnings.
markers = [
    "proves(id, depth): the subject this test is the proof of",
    "informs(id): the subject this test bears on without proving",
]
